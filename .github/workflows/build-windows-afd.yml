name: Build Windows Portable (AFD)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "Code/Construcción de AFD"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Qt (MSVC 64 bits)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Configurar CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release

      - name: Crear carpeta portable con windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Release\afd_qt.exe dist\
          windeployqt --release --compiler-runtime dist\afd_qt.exe

      - name: Subir carpeta portable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AFD-Windows-Portable
          path: "Code/Construcción de AFD/dist"
